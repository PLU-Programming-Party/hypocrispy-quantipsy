<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let count = 0;
        function theFunction(index, length) {
            fetch(`http://127.0.0.1:5000/gamez?index=${index}&length=${length}`).then((resp) => resp.json()).then((memez) => {
                memez.forEach(meme => {
                    const img = document.createElement("img");
                    img.setAttribute("src", meme.image_url);
                    img.setAttribute("title", meme.description);
                    img.addEventListener("click", ()=>theFunction(meme.id, length));
                    document.body.appendChild(img);
                });
            })
        }
        theFunction(67, 3);
    </script>
    <style>
        /* img{width: 50px; height: 50px;} */
    </style>
</body>
</html>
